# Serves the built web app and proxies /api to the API service (same origin, so the HttpOnly session cookie needs no CORS).
# TLS is terminated in front of this container (load balancer / ingress). Set WEB_ORIGIN on the API to the PUBLIC https origin.
#
# nginx rule that shaped this file: an add_header inside a location REPLACES every add_header inherited from the server block.
# So the security headers are written in each location that serves the SPA (identical blocks; infra/scripts/check-container-files.mjs
# fails if they drift or if a location adds its own header and loses them), and /api/ adds none: the API sends its own (helmet).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  location = /nginx-health { access_log off; return 200 "ok\n"; }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # The API's own body limit is 256 KiB; this is only a ceiling in front of it.
    client_max_body_size 1m;
    # Live tail and exports stream: never buffer them.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
  }

  # Hashed assets are immutable; a missing asset is a 404, never the SPA shell.
  location /assets/ {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # The SPA needs no third-party origins. 'unsafe-inline' for styles only (Tailwind/Vite inject none in production builds,
    # but React sets inline style attributes).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    gzip on; gzip_vary on; gzip_min_length 1024; gzip_types text/css application/javascript text/javascript image/svg+xml application/json;
    try_files $uri =404;
  }

  # index.html and everything else: SPA fallback, always revalidated.
  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control "no-cache" always;
    gzip on; gzip_vary on; gzip_min_length 1024; gzip_types text/css application/javascript text/javascript image/svg+xml application/json text/html;
    try_files $uri /index.html;
  }
}
